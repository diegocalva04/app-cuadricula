# Memoria máxima y codificación utilizadas por el proceso de Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Habilita las bibliotecas AndroidX.
android.useAndroidX=true

# Aplica el estilo oficial de Kotlin.
kotlin.code.style=official

# Limita la clase R de cada módulo a sus propios recursos.
android.nonTransitiveRClass=true
