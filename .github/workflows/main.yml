# Modificado en 2026 por Diego Calva para validar la adaptación del proyecto.
name: Compilación

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        
      - name: Probar y compilar el proyecto
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
